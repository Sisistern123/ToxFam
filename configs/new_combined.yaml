# standard.yaml
input_csv: "data/processed/training_data.csv"
h5_paths_glob: "data/processed/embeddings/training_data.h5"
# tax_h5_path is NOT needed for standard, but keeping it empty or defined prevents
# errors if your dataset class expects the key to exist (even if None).
tax_h5_path: "data/processed/taxonomy/binary_taxonomy_vectors.h5" # REQUIRED
output_dir: "model/model_output/calibrated_combined"

# Strategy
training_strategy: "combined"

# Hyperparameters
# Focal Loss vs CE Loss
use_focal_loss: false # CE
focal_loss_gamma: 2.0

batch_size: 64
hidden_dims: [256, 256]
dropout: 0.5
num_epochs: 200
learning_rate: 0.0001
early_stopping_patience: 10

# Dimensions
embedding_dim: 1024
tax_dim: 56