# combined_multitask.yaml — Two-branch input + dual heads (family + binary)
# Combines taxonomy-aware input (like combined) with joint inference (like multitask)
input_csv: "data/processed/training_data.csv"
h5_paths_glob: "data/processed/embeddings.h5"
tax_h5_path: "data/processed/taxonomy_vectors.h5"
output_dir: "model/model_output/combined_multitask"

# Strategy
training_strategy: "multitask"

# Architecture
hidden_dims: [256, 256]
dropout: 0.5
embedding_dim: 1024
tax_dim: 50

# Optimizer
optimizer: "adamw"
weight_decay: 0.01
learning_rate: 0.0001

# LR Scheduler
lr_scheduler: "cosine"
warmup_epochs: 5

# Training
batch_size: 64
num_epochs: 200
early_stopping_patience: 10
early_stopping_metric: "mcc"
max_grad_norm: 1.0
seed: 42

# Multitask loss weights
multitask_family_weight: 1.0
multitask_binary_weight: 1.0
