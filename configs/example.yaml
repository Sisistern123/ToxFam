# example.yaml — Annotated reference config for ToxFam training
#
# All fields shown with their defaults. Only `input_csv`, `h5_paths_glob`,
# `output_dir`, and `training_strategy` are required.

# ── 1. DATA ──────────────────────────────────────────────────────────────────
input_csv: "data/processed/training_data.csv"          # CSV with identifier, Protein families, Split columns
h5_paths_glob: "data/processed/embeddings.h5"          # Glob pattern for ProtT5 embedding HDF5 files
tax_h5_path: "data/processed/taxonomy_vectors.h5"      # Multi-hot taxonomy vectors (required for "combined")
output_dir: "model/model_output/example_run"           # All outputs saved here

# ── 2. STRATEGY ──────────────────────────────────────────────────────────────
# "standard" — single ModularMLP on embeddings only
# "combined" — MultiInputMLP with two branches (embeddings + taxonomy)
training_strategy: "standard"

# ── 3. OPTIMIZER ─────────────────────────────────────────────────────────────
optimizer: "adamw"           # "adam" or "adamw"
weight_decay: 0.01           # Only used by adamw
learning_rate: 0.0001

# ── 4. LR SCHEDULER ─────────────────────────────────────────────────────────
lr_scheduler: "cosine"       # "none" or "cosine" (with linear warmup)
warmup_epochs: 5             # Linear warmup epochs before cosine decay

# ── 5. LOSS FUNCTION ────────────────────────────────────────────────────────
use_focal_loss: false        # true → FocalLoss, false → CrossEntropyLoss
focal_loss_gamma: 2.0        # Focal loss focusing parameter (only when use_focal_loss=true)
label_smoothing: 0.0         # Label smoothing factor [0, 1)

# ── 6. ARCHITECTURE ─────────────────────────────────────────────────────────
hidden_dims: [256, 256]      # Hidden layer dimensions for the MLP
dropout: 0.5                 # Dropout rate [0, 1]
embedding_dim: 1024          # ProtT5 embedding dimension
tax_dim: 50                  # Taxonomy vector dimension (only for "combined")

# ── 7. TRAINING ──────────────────────────────────────────────────────────────
batch_size: 64
num_epochs: 200
early_stopping_patience: 10  # Epochs without improvement before stopping
early_stopping_metric: "mcc" # "mcc" (maximize) or "loss" (minimize)
max_grad_norm: 1.0           # Gradient clipping max norm (null to disable)
seed: 42                     # Random seed for reproducibility (null to disable)

# ── 8. WANDB ────────────────────────────────────────────────────────────────
wandb_project: "toxfam"      # Weights & Biases project name
wandb_entity: "toxfam"       # wandb team name for shared projects
wandb_run_name: null         # Run name (null → auto-generated by wandb)
