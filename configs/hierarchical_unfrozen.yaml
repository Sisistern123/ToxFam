input_csv: data/processed/training_data.csv
h5_path: data/processed/embeddings.h5
output_dir: model/hierarchical_unfrozen

training_strategy: hierarchical

embedding_dim: 1024
hidden_dims: [256, 256]
dropout: 0.3

batch_size: 64
num_epochs: 200
learning_rate: 0.0001
early_stopping_patience: 10
early_stopping_metric: mcc

# Stage 2: fine-tune entire backbone
stage2_freeze_backbone: false
stage2_learning_rate: 0.00001
stage2_hidden_dim: 64
