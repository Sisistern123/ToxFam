# hierarchical_unfrozen.yaml — Hierarchical training with unfrozen (fine-tuned) backbone
input_csv: "data/processed/training_data.csv"
h5_paths_glob: "data/processed/embeddings.h5"
tax_h5_path: null
output_dir: "model/model_output/hierarchical_unfrozen_run"

# Strategy
training_strategy: "hierarchical"

# Hyperparameters
batch_size: 64
hidden_dims: [256, 256]
dropout: 0.3
num_epochs: 200
learning_rate: 0.0001
early_stopping_patience: 15

# Dimensions
embedding_dim: 1024

# Hierarchical-specific settings — unfrozen backbone with very low LR
stage2_freeze_backbone: false
stage2_learning_rate: 0.000001
stage2_hidden_dim: 64
family_min_count: 10
