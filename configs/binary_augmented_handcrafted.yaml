# binary_augmented_handcrafted.yaml — Augmented model + handcrafted features experiment
# Uses: ProtT5 embeddings + HBI + length + venom indicator + Atchley factors + cysteine patterns
# Tests whether explicit physicochemical + disulfide features complement ProtT5
input_csv: "data/processed/training_data_with_counterparts.csv"
h5_paths:
  - "data/processed/embeddings.h5"
  - "data/processed/counterpart_embeddings.h5"
tax_h5_path: null
output_dir: "model/model_output/binary_augmented_handcrafted_run"

# Strategy
training_strategy: "binary"

# Hyperparameters
batch_size: 64
hidden_dims: [256, 256]
dropout: 0.3
num_epochs: 200
learning_rate: 0.0001
early_stopping_patience: 10

# Dimensions
embedding_dim: 1024

# HBI features (4-dim)
hbi_h5_path: "data/intermediate/hbi/hbi_features_with_counterparts.h5"
hbi_dim: 4

# Handcrafted features (15-dim: Atchley 10 + Cysteine 5)
handcrafted_h5_path: "data/intermediate/handcrafted/handcrafted_features.h5"
handcrafted_dim: 15

# Additional scalar features
include_length: true
include_venom_indicator: true

# effective_embedding_dim = 1024 + 4 + 15 + 1 + 1 = 1045
