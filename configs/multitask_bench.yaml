input_csv: "data/processed/training_data.csv"
h5_paths_glob: "data/processed/embeddings.h5"
output_dir: "model/model_output/multitask_bench"
training_strategy: "multitask"
embedding_dim: 1024
hidden_dims: [256, 256]
dropout: 0.5
optimizer: "adamw"
weight_decay: 0.01
learning_rate: 0.0001
lr_scheduler: "cosine"
warmup_epochs: 5
batch_size: 64
num_epochs: 200
early_stopping_patience: 10
early_stopping_metric: "mcc"
max_grad_norm: 1.0
seed: 42
multitask_family_weight: 1.0
multitask_binary_weight: 1.0
