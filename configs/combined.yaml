# combined.yaml
input_csv: "data/processed/training_data.csv"
h5_paths_glob: "data/processed/embeddings.h5"
tax_h5_path: "data/intermediate/taxonomy/binary_taxonomy_vectors.h5" # REQUIRED
output_dir: "model/model_output/0_CALIBRATED_combined_run"

# Strategy
training_strategy: "combined"

# Hyperparameters
batch_size: 64
hidden_dims: [256, 256]
dropout: 0.5
num_epochs: 200
learning_rate: 0.0001
early_stopping_patience: 10

# Dimensions
embedding_dim: 1024
tax_dim: 56