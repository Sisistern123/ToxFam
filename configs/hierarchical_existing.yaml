# hierarchical_existing.yaml — Hierarchical training using existing training_data.csv
# Uses standard preprocessing data with is_toxic derived at runtime from family labels.
input_csv: "data/processed/training_data.csv"
h5_paths_glob: "data/processed/embeddings.h5"
tax_h5_path: null
output_dir: "model/model_output/hierarchical_existing_run"

# Strategy
training_strategy: "hierarchical"

# Hyperparameters
batch_size: 64
hidden_dims: [256, 256]
dropout: 0.3
num_epochs: 200
learning_rate: 0.0001
early_stopping_patience: 15

# Dimensions
embedding_dim: 1024

# Hierarchical-specific settings
stage2_freeze_backbone: true
stage2_learning_rate: 0.00001
stage2_hidden_dim: 64
family_min_count: 10
