# standard_concatenated_taxa.yaml
input_csv: "data/processed/training_data.csv"
h5_paths_glob: "data/processed/taxonomy/normed_training_data_with_tax.h5" # -2 to 2 normed tax IDs concatenated to embeddings
# tax_h5_path is NOT needed for standard, but keeping it empty or defined prevents
# errors if your dataset class expects the key to exist (even if None).
tax_h5_path: null
output_dir: "model/model_output/normed_standard_run"

# Strategy
training_strategy: "standard"

# Hyperparameters
# Focal Loss vs CE Loss
use_focal_loss: false
focal_loss_gamma: 2.0

batch_size: 64
hidden_dims: [256, 256]
dropout: 0.5
num_epochs: 200
learning_rate: 0.0001
early_stopping_patience: 10

# Dimensions (Only Embedding needed)
embedding_dim: 1030