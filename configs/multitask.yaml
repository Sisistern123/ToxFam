input_csv: data/processed/training_data.csv
h5_path: data/processed/embeddings.h5
output_dir: model/multitask

training_strategy: multitask

embedding_dim: 1024
hidden_dims: [256, 256]
dropout: 0.3

batch_size: 64
num_epochs: 200
learning_rate: 0.0001
early_stopping_patience: 10
early_stopping_metric: mcc

multitask_family_weight: 1.0
multitask_binary_weight: 1.0
