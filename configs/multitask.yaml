# multitask.yaml — Joint family + binary classification
input_csv: "data/processed/training_data.csv"
h5_paths_glob: "data/processed/embeddings.h5"
tax_h5_path: null
output_dir: "model/model_output/multitask_run"

# Strategy
training_strategy: "multitask"

# Hyperparameters
batch_size: 64
hidden_dims: [256, 256]
dropout: 0.5
num_epochs: 200
learning_rate: 0.0001
early_stopping_patience: 10

# Dimensions
embedding_dim: 1024

# Multi-task weights
multitask_family_weight: 1.0
multitask_binary_weight: 1.0
