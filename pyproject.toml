[project]
name = "toxfam"
version = "0.2.0"
description = "Animal toxin protein family classification using MLP on ProtT5 embeddings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "iterative-stratification>=0.1.9",
    "jupyter>=1.1.1",
    "protobuf>=6.33.5",
    "protspace==3.3.1",
    "pydantic>=2.0",
    "pymmseqs>=1.0.4",
    "rich>=14.3.2",
    "seaborn>=0.13.2",
    "sentencepiece>=0.2.1",
    "taxopy>=0.14.0",
    "tiktoken>=0.12.0",
    "torch>=2.7.1",
    "transformers>=5.1.0",
    "typer>=0.15.0",
    "wandb>=0.25.0",
]

[project.scripts]
toxfam = "toxfam.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toxfam"]

[dependency-groups]
dev = [
    "kaleido>=1.2.0",
    "plotly>=6.6.0",
    "ruff>=0.15.4",
]
