# 0_example_config.yaml

# 1. DATA
input_csv: "data/interm/training_data.csv"
h5_paths_glob: "data/protspace/training_data.h5"
tax_h5_path: "data/tax/binary_taxonomy_vectors.h5"
output_dir: "model/model_output/finetune"

# 2. STRATEGY (The Master Switch)
# Options: "standard" | "combined" | "pretrain_finetune"
# standard is one MLP
# combined is a taxa and a tox MLP getting combined in the end
# pretrain_finetune is a MLP getting pretrained on taxa and then on tox
training_strategy: "pretrain_finetune"

# 3. HYPERPARAMETERS
use_focal_loss: true
focal_loss_gamma: 2.0
batch_size: 64
dropout: 0.5
hidden_dims: [256, 256]

# 4. STRATEGY-SPECIFIC SETTINGS
# Dimensions
embedding_dim: 1024
tax_dim: 56

# Standard / Combined / Stage 2 Settings
num_epochs: 200
learning_rate: 0.0001
early_stopping_patience: 10
freeze_backbone: false  # Only for pretrain_finetune stage 2

# Pretrain Stage 1 Settings (Only for pretrain_finetune)
tax_epochs: 50
tax_lr: 0.001